services:
  senders-dashboard:
    build: .
    container_name: grantiliff-senders
    restart: unless-stopped

    # Host networking: the container shares the host's network stack, so it
    # reaches the database over exactly the same route as a `mysql` CLI run on
    # the host. On the default bridge network the container instead routes
    # through docker's own 172.x network, which fails against a DB at
    # 172.16.1.2 with a silent `connect ETIMEDOUT` -- either because a docker
    # subnet overlaps 172.16.0.0/12 (so the container treats the DB as
    # link-local and ARPs for it on the bridge), or because the host's FORWARD
    # chain drops container traffic to that interface.
    #
    # Consequence: PORT from .env binds directly on the host, so there is no
    # `ports:` mapping to declare here.
    network_mode: host

    env_file:
      - .env
    # DB_HOST / DB_PORT / PORT come from .env only. An `environment:` entry
    # here would outrank env_file and silently override the deployment.
