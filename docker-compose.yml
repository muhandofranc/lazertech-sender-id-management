services:
  senders-dashboard:
    build: .
    container_name: grantiliff-senders
    restart: unless-stopped
    ports:
      - "3020:3020"
    env_file:
      - .env
    # DB_HOST and DB_PORT deliberately come from .env only. An `environment:`
    # entry here would take precedence over env_file and silently override
    # whatever the deployment configured -- which is exactly how a production
    # DB_HOST=172.16.1.2 ended up dialling the docker bridge gateway instead.
    #
    #   production        DB_HOST=172.16.1.2     DB_PORT=3130
    #   MySQL on this box DB_HOST=host.docker.internal
    #
    # The mapping below is what makes that second case work; it is harmless
    # when DB_HOST points at a real remote host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
